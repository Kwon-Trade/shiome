# 「潮目」バックテスト設定
# 日付・URL・コストなど、ルールに書く前提のパラメータをここに集約する

date_range:
  start: "2022-01-01"
  end: null  # null = 実行時点の直近まで

split:
  rule_building_end: "2024-12-31"   # ここまでが「ルール作り期間」
  holdout_start: "2025-01-01"       # ここからが「答え合わせ期間」

urls:
  # data.binance.vision(CDN)とfapi.binance.comはこの実行環境からブロックされているため、
  # 同じ実体であるS3バケットへ直接アクセスする(ファンディングレートもS3の一括データを使う)。
  vision_base: "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
  vision_bucket_listing: "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"

intervals:
  klines: "1h"
  futures_metrics_native: "5m"

download:
  max_workers: 20
  request_timeout_sec: 30
  max_retries: 5
  retry_backoff_sec: 2

cost_model:
  round_trip_fee_pct: 0.10   # 往復手数料 0.10%
  # 24h平均出来高(USD)の段階に応じた片道スリッページ上乗せ(%)
  # 出来高が小さいほど大きく上乗せする
  slippage_tiers_usd_volume:
    - {min_usd: 100000000, slippage_pct: 0.02}   # 1億ドル以上
    - {min_usd: 20000000,  slippage_pct: 0.05}
    - {min_usd: 5000000,   slippage_pct: 0.10}
    - {min_usd: 1000000,   slippage_pct: 0.25}
    - {min_usd: 0,         slippage_pct: 0.50}    # それ未満

validation:
  min_sample_size: 30          # これ未満は「判定保留」
  horizons_hours: [4, 24, 72]
  primary_horizon_hours: 24    # 合格判定はこれだけで行う(多重検定対策。詳細はdocs/methodology.md #6)
  random_symbol_split_seed: 42

  # しきい値(パーセンタイル)計算用のローリング窓。docs/methodology.md #1
  # 90日(1時間足2,160本)あれば安定するので、これより長くしても意味は薄い。
  # 窓が埋まるまでの最初の90日間は局面判定そのものを行わない(助走期間)。
  percentile_lookback_days: 90

  # イベント重複カウント防止。docs/methodology.md #3
  min_recount_gap_hours: 24

  # 局面ごとの期待方向。docs/methodology.md #4
  phase_expected_direction:
    "1_healthy_uptrend": up
    "2_overleveraged_uptrend": down
    "3_short_squeeze_setup": up
    "4_distribution_top": down
    "5_capitulation_bottom": up
    "6_compression": neutral   # 方向は評価しない。値幅拡大の有無で評価

  # ブロック・ブートストラップ設定。docs/methodology.md #5
  bootstrap:
    block_days: 7
    n_resamples: 1000
    confidence_level: 0.95

  # 「高値圏」の定義。docs/methodology.md #10
  price_zone_high:
    lookback_days: 30
    percentile_threshold: 20   # 高値からの下落率が下位20パーセンタイル以内

# 局面判定(ステージ3)で使うパーセンタイルしきい値。
# 「固定の数値」ではなく「パーセンタイルの区切り値」として、銘柄ごとの90日ローリング窓に
# 適用する(docs/methodology.md #1)。ここだけ変更すれば全局面のしきい値を一括調整できる。
phase_thresholds:
  high_percentile: 80     # 「高い」「急増」「急上昇」(②③④の上限条件)
  low_percentile: 20      # 「低い」「縮小」「ショート寄り」(④⑥、高値圏の定義にも流用)
  extreme_percentile: 90  # 「急落」「急減」「急低下」(⑤、より極端な事象)
  neutral_band: [30, 70]  # 「平常」「中立」(①⑥)
  # ①「建玉ゆるやか増」の上限(=これ以上は「急増」とみなし①から除外)。
  # high_percentileと意味が逆(高いほど条件が緩くなる)なので、
  # 誤って同じパラメータを共用しないよう独立させている。値は元々high_percentileと
  # 同じ80を使っていたので、ここも80のままにして発生率が変わらないようにする。
  gentle_upper_percentile: 80
