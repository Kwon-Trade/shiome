# 答え合わせ(2025-01〜2026-08)で比較対象から外す「暗号資産ではない」先物。
#
# 2025年以降、Binance先物には株式・ETF・金属・原油・上場前企業などに連動する先物が大量に上場した
# (2022〜2024年にはほぼ無かった)。コイン同士の比較には入れない。
# 決め方(値動きの成績は一切見ずに、銘柄名と「Binance現物があるか」だけで決めた。2026-09-29):
#   1. Binance現物(USDT建て)がある銘柄は暗号資産とみなして残す。株式・商品はBinance現物では売買されないため。
#      ただし金に連動するトークン(PAXG・XAUT)は商品連動なので外す。
#   2. 現物が無い銘柄のうち、株式・ETF・商品・上場前企業の名前は外す(non_crypto)。
#   3. 現物が無く、株の略号と重なるなど判断がつかない名前も、念のため外す(uncertain_excluded)。
#      株を混ぜる害(2025年以降に上場した株が「上場90日以内」を占める)の方が、小さな暗号資産を少し落とす害より大きいため。
#   4. 既存の除外(src/shiome/data/symbols.py の EXCLUDE_NON_CRYPTO_SYMBOLS、指数先物)もそのまま外す。
#      ただし現物がある銘柄は 1. を優先する(例: HEIUSDT は現物があるので残す)。
