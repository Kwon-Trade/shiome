#
# 手元のデータは2022-01-01から始まるため、それより前に上場した銘柄は
# 手元のデータだけでは上場日が分からない。そこで Binance公開データ(S3)の
# ファイル名一覧(中身は読まない)から、最初の月次ファイルの月を調べて記録した。
# 2021年9月以前に上場した銘柄は、2022-01-01の時点で既に90日以上たっているため月だけで十分。
# 2021年10月以降に上場した2銘柄は日次ファイル名から日付まで調べた。
